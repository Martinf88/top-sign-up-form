<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Odin Sign Up Form</title>
  </head>
  <body>
    <section class="hero">
      <img
        src="/assets/andres-herrera-OnmnyEoMtzw-unsplash.jpg"
        alt="Winter Landscape"
      />
      <span class="credit">
        Photo by
        <a
          href="https://unsplash.com/@andresherrerapics?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >Andres Herrera</a
        >
        on
        <a
          href="https://unsplash.com/photos/body-of-water-between-bare-trees-during-daytime-OnmnyEoMtzw?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >Unsplash</a
        >
      </span>
      <div class="logo-wrapper">
        <img src="/assets/odin-lined.png" alt="Logo of Odins head" />
        <h1>ODIN</h1>
      </div>
    </section>
    <main class="content">
      <section class="paragraph">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up now
          to get started.
        </p>
        <p>You know you want to.</p>
      </section>
      <section class="form">
        <h2>Let's do this!</h2>
        <form action="">
          <div class="input">
            <label for="">FIRST NAME</label>
            <input type="text" />
          </div>
          <div class="input">
            <label for="">LAST NAME</label>
            <input type="text" />
          </div>
          <div class="input">
            <label for="">EMAIL</label>
            <input type="text" />
          </div>
          <div class="input">
            <label for="">PHONE NUMBER</label>
            <input type="text" />
          </div>
          <div class="input">
            <label for="">PASSWORD</label>
            <input type="text" />
          </div>
          <div class="input">
            <label for="">CONFIRM PASSWORD</label>
            <input type="text" />
          </div>
        </form>
      </section>
      <section>
        <button>Create Account</button>
        <p>
          Already have and account?<span><a href="">Log In</a></span>
        </p>
      </section>
    </main>
  </body>
</html>
