<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Odin Sign Up Form</title>
  </head>
  <body>
    <div class="signup-hero">
      <img
        src="/assets/andres-herrera-OnmnyEoMtzw-unsplash.jpg"
        alt="Winter Landscape"
        class="signup-hero__image"
      />

      <span class="signup-hero__credit">
        Photo by
        <a href="#">Andres Herrera</a>
        on
        <a href="#">Unsplash</a>
      </span>

      <div class="signup-hero__branding">
        <img src="/assets/odin-lined.png" alt="Logo of Odins head" />
        <h1 class="signup-hero__title">ODIN</h1>
      </div>
    </div>

    <main class="signup">
      <section class="signup__intro">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up now
          to get started.
        </p>
        <p>You <i>know</i> you want to.</p>
      </section>

      <section class="signup__form-section">
        <h2 class="signup__heading">Let's do this!</h2>

        <form id="signup-form" class="signup-form">
          <div class="signup-form__field">
            <label for="user_first_name">FIRST NAME *</label>
            <input
              type="text"
              id="user_first_name"
              name="user_first_name"
              minlength="2"
              title="Enter your first name (at least 2 characters)"
              required
            />
          </div>

          <div class="signup-form__field">
            <label for="user_last_name">LAST NAME *</label>
            <input
              type="text"
              id="user_last_name"
              name="user_last_name"
              minlength="2"
              title="Enter your last name (at least 2 characters)"
              required
            />
          </div>

          <div class="signup-form__field">
            <label for="user_email">EMAIL *</label>
            <input
              type="email"
              id="user_email"
              name="user_email"
              title="Enter a valid email address (e.g. name@example.com)"
              required
            />
          </div>

          <div class="signup-form__field">
            <label for="user_phone_number">PHONE NUMBER *</label>
            <input
              type="tel"
              id="user_phone_number"
              name="user_phone_number"
              pattern="^\+?[0-9\s\-]{7,15}$"
              title="Enter a valid phone number (7–15 digits, optional +, spaces or dashes)"
              required
            />
          </div>

          <div class="signup-form__field">
            <label for="user_password">PASSWORD *</label>
            <input
              type="password"
              id="user_password"
              name="user_password"
              pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
              title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
              required
            />
          </div>

          <div class="signup-form__field">
            <label for="confirm_user_password">CONFIRM PASSWORD *</label>
            <input
              type="password"
              id="confirm_user_password"
              name="confirm_user_password"
              pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
              title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
              required
            />
          </div>
        </form>
      </section>

      <section class="signup__actions">
        <button class="signup__button" type="submit" form="signup-form">
          Create Account
        </button>
        <p>
          Already have an account?
          <a href="#" class="signup__login-link">Log In</a>
        </p>
      </section>
    </main>
  </body>
</html>
